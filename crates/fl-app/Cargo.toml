[package]
name = "fl-app"
description = "FL Daily Edit: desktop app and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "fl_app"
path = "src/lib.rs"

[[bin]]
name = "fldailyedit"
path = "src/main.rs"

[dependencies]
fl-engine.workspace = true
fl-fs.workspace = true
fl-save.workspace = true
fl-update = { path = "../fl-update" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17"
opener = { version = "0.9", features = ["reveal"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
