[project]
name = "fldailyedit"
version = "0.1.0"
description = "Daily Football Life save updater powered by real-world transfer synchronization"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "curl-cffi>=0.13.0",
    "rapidfuzz>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
installer-build = [
    "pyinstaller>=6.14,<7",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "editor*", "installer*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
