[project]
name = "fleditscrape"
version = "0.1.0"
description = "Player transfer automation tool for Football Life (All Versions) & PES 2021"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "rapidfuzz>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "editor*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
