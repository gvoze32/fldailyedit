name: Player Update Request
description: Request a new player or an update to an existing player. A maintainer will review the data before it is added.
title: "[Player Update]: "
labels: ["player-spec"]
body:
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      description: Choose create to add a new player, or update to change an existing player.
      options:
        - create
        - update
    validations:
      required: true

  - type: input
    id: player_name
    attributes:
      label: Player name
      description: Enter the canonical player name exactly as shown on the Pes Retro Stats profile.
      placeholder: Dastan Satpaev
    validations:
      required: true

  - type: input
    id: pes_retro_stats_profile
    attributes:
      label: Pes Retro Stats profile
      description: Provide one canonical Pes Retro Stats player profile URL.
      placeholder: https://pesretrostats.com/player/f77d9c27-dastan-satpaev
    validations:
      required: true

  - type: input
    id: current_team
    attributes:
      label: Current team
      description: Enter the player's current team as supported by the evidence.
    validations:
      required: true

  - type: input
    id: effective_date
    attributes:
      label: Effective date
      description: Enter the evidence date in YYYY-MM-DD format.
      placeholder: "2026-08-04"
    validations:
      required: true

  - type: textarea
    id: proof_urls
    attributes:
      label: Proof URLs
      description: Enter one HTTPS evidence URL per line (maximum 10).
    validations:
      required: true

  - type: textarea
    id: contributor_notes
    attributes:
      label: Contributor notes
      description: Add optional context for the reviewing maintainer.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Confirm every statement before submitting.
      options:
      - label: I supplied one canonical Pes Retro Stats player profile.
        required: true
      - label: I understand autofilled PES values are unapproved proposals.
        required: true
      - label: I understand a maintainer must review the draft PR.
        required: true
