name: Sync Live Transfers

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync Mode: sweep (150+ clubs + squad sync), global (all leagues), deep, club (specific target)"
        type: choice
        options:
          - sweep
          - global
          - deep
          - club
        default: sweep
        required: false
      club:
        description: "Target Club(s) (only used if Mode=club, e.g. 'Chelsea, Real Madrid')"
        type: string
        default: ""
        required: false
      window:
        description: "Transfer Window to scrape"
        type: choice
        options:
          - auto
          - summer
          - winter
          - all
        default: all
        required: false
      since:
        description: "Scrape transfers since date (YYYY-MM-DD, optional override)"
        type: string
        default: ""
        required: false
      dry_run:
        description: "Dry Run (simulate only, do not alter save file)"
        type: boolean
        default: false
        required: false
      pages:
        description: "Maximum number of FotMob pages to scrape (50 transfers per page)"
        type: number
        default: 40
        required: false
      popular:
        description: "Only scrape popular / major transfers"
        type: boolean
        default: false
        required: false

jobs:
  sync:
    name: Scrape & Apply Transfers
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Compile pesXdecrypter
        run: |
          make -C vendor/pesXdecrypter clean
          make -C vendor/pesXdecrypter
          chmod +x vendor/pesXdecrypter/decrypter21 vendor/pesXdecrypter/encrypter21

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Transfer Sync
        id: run_sync
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          POPULAR_FLAG=""
          if [ "${{ github.event.inputs.popular }}" = "true" ]; then
            POPULAR_FLAG="--popular"
          fi

          SINCE_FLAG=""
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE_FLAG="--since ${{ github.event.inputs.since }}"
          fi

          MODE_FLAG="--sweep"
          if [ "${{ github.event.inputs.mode }}" = "deep" ]; then
            MODE_FLAG="--deep"
          elif [ "${{ github.event.inputs.mode }}" = "global" ]; then
            MODE_FLAG=""
          elif [ "${{ github.event.inputs.mode }}" = "club" ] && [ -n "${{ github.event.inputs.club }}" ]; then
            MODE_FLAG="--club '${{ github.event.inputs.club }}'"
          fi

          WINDOW="${{ github.event.inputs.window || 'all' }}"
          PAGES="${{ github.event.inputs.pages || 40 }}"

          eval python run.py run \
            --window "$WINDOW" \
            --pages "$PAGES" \
            $SINCE_FLAG \
            $POPULAR_FLAG \
            $DRY_RUN_FLAG \
            $MODE_FLAG \
            --edit-file sample/EDIT00000000 \
            --output output/EDIT00000000

      - name: Generate Actions Summary
        if: always()
        run: |
          echo "## ⚽ FLEditScrape Transfer Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/transfer_log.jsonl ]; then
            COUNT=$(wc -l < data/transfer_log.jsonl | tr -d ' ')
            echo "✅ **Transfers Processed:** $COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Timestamp | Player | From Club | To Club | Type | Confidence |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            tail -n 20 data/transfer_log.jsonl | python3 -c "
          import sys, json
          for line in sys.stdin:
              if line.strip():
                  d = json.loads(line)
                  print(f\"| {d.get('timestamp','')} | **{d.get('player_name','')}** | {d.get('from_team','')} | {d.get('to_team','')} | {d.get('transfer_type','')} | {d.get('confidence',0):.1f}% |\")
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new transfers written to log (dry-run or no matching transfers)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Updated Save File & Visual Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-fl-save-and-reports
          path: |
            output/EDIT00000000
            output/transfer_summary.md
            output/transfer_summary.html
            data/transfer_log.jsonl
          if-no-files-found: ignore
          retention-days: 14
