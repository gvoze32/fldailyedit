name: Build & Release

# One Ubuntu runner (cheapest minutes): tests, then the Windows .exe
# cross-compiled with mingw (x86_64-pc-windows-gnu). When the workspace version
# in Cargo.toml has no matching vX.Y.Z release yet, the .exe is published as that
# release together with a signed update manifest. The in-app update checker
# reads the newest release, so bumping `version` in Cargo.toml and pushing to
# main is all it takes to release.
#
# Release assets (vX.Y.Z):
#   FLDailyEdit.exe         the raw Windows executable users download
#   FLDailyEdit.exe.sha256  its SHA-256
#   update.json             signed manifest (version, download_url, size, sha256)
#   update.json.sig         Ed25519 signature of update.json (secret INSTALLER_SIGNING_KEY)
#
# The file keeps its name so the GitHub workflow id stays the same.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run on main: it may be half-way through publishing a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-gnu
  APP: FLDailyEdit

jobs:
  build:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 \
            libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$WINDOWS_TARGET"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      # The fl-app `snapshots` test renders every screen through wgpu and
      # compares PNGs, which needs a GPU adapter; it runs locally
      # (`cargo test --workspace`) and is skipped on the GPU-less runner.
      - name: Test
        run: |
          cargo test --locked --workspace --exclude fl-app
          cargo test --locked -p fl-app --lib --test cli --test flows

      - name: Build Windows
        run: cargo build --locked --release -p fl-app --target "$WINDOWS_TARGET"

      - name: Check executable format
        run: |
          exe="target/$WINDOWS_TARGET/release/$APP.exe"
          info="$(file -b "$exe")"
          echo "$info"
          case "$info" in
            PE32+*GUI*x86-64*) ;;
            *) echo "::error::expected a 64-bit Windows GUI executable"; exit 1 ;;
          esac

      - name: Package
        run: |
          mkdir -p dist
          cp "target/$WINDOWS_TARGET/release/$APP.exe" "dist/$APP.exe"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum "$APP.exe" > "$APP.exe.sha256")
          ls -l dist

      # The signing secret is not available to pull requests, so only release
      # builds produce (and verify) the signed manifest.
      - name: Build update manifest
        if: steps.meta.outputs.release == 'true'
        run: >-
          cargo run --release --locked -p fl-update --bin sign-manifest --
          build
          --asset "dist/$APP.exe"
          --version "${{ steps.meta.outputs.version }}"
          --output dist/update.json

      - name: Sign update manifest
        if: steps.meta.outputs.release == 'true'
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: |
          if [ -z "$INSTALLER_SIGNING_KEY" ]; then
            echo "::error::INSTALLER_SIGNING_KEY secret is required to sign update.json"
            exit 1
          fi
          cargo run --release --locked -p fl-update --bin sign-manifest -- \
            sign --manifest dist/update.json --output dist/update.json.sig

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FLDailyEdit-v${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: steps.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "FL Daily Edit v$version" \
            --generate-notes \
            dist/FLDailyEdit.exe \
            dist/FLDailyEdit.exe.sha256 \
            dist/update.json \
            dist/update.json.sig
