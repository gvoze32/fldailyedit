name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "tests/test_installer_*.py"
      - "tests/test_release_asset.py"
      - "tests/test_release_publisher.py"
      - "tools/publish_release_assets.py"
      - "FLDailyEditInstaller.spec"
      - "pyproject.toml"
      - ".github/workflows/build-installer.yml"
      - "data/major_clubs.json"
      - "data/fotmob_teams_validated.json"
      - "data/name_overrides.json"
      - "data/team_aliases.json"
      - "data/FL262_teams.txt"
      - "data/FL2622wc_players.txt"
      - "data/players.csv"
      - "data/release_policy.json"
      - "vendor/pesXdecrypter/src/**"
      - "config.py"
      - "local_update.py"
      - "run.py"
      - "run_pipeline.py"
      - "native_metadata.py"
      - "transfer_planning.py"
      - "editor/**"
      - "scraper/**"

jobs:
  build:
    name: Test and package Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install -e ".[installer-build]"
          python -m pip install -e ".[dev]"
      - name: Prepare Windows crypto tools
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "pesXdecrypter_2021.7z"
          $expected = "201800b731a8c90109b30afeef26fb0cdcd552d2910b322bbc253b000d6aa3a6"
          Invoke-WebRequest `
            -Uri "https://github.com/the4chancup/pesXdecrypter/releases/download/6.0.0/pesXdecrypter_2021.7z" `
            -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "pesXdecrypter archive checksum mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP "pesXdecrypter"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip was not found at $sevenZip"
          }
          & $sevenZip x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract pesXdecrypter archive"
          }
          foreach ($name in @("decrypter21.exe", "encrypter21.exe")) {
            $source = Join-Path $extract $name
            if (-not (Test-Path $source)) {
              throw "Missing crypto binary after extraction: $name"
            }
            Copy-Item -Force $source (Join-Path "vendor\pesXdecrypter" $name)
          }
      - name: Run installer and release tests
        run: >-
          python -m pytest
          tests/test_installer_catalog.py
          tests/test_installer_paths.py
          tests/test_installer_install.py
          tests/test_installer_app.py
          tests/test_release_asset.py
          tests/test_workflow_config.py
          -q
      - name: Run source self-test
        run: python -m installer --self-test
      - name: Build one-file installer
        run: pyinstaller --clean --noconfirm FLDailyEditInstaller.spec
      - name: Smoke-test packaged installer
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\FLDailyEditInstaller.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer self-test exited $($process.ExitCode)"
          }
      - name: Package installer ZIP
        shell: pwsh
        run: |
          $zip = "dist\FLDailyEditInstaller.zip"
          Compress-Archive `
            -Path "dist\FLDailyEditInstaller.exe" `
            -DestinationPath $zip `
            -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entries.Count -ne 1 -or $entries[0] -ne "FLDailyEditInstaller.exe") {
              throw "Installer ZIP must contain exactly FLDailyEditInstaller.exe"
            }
          } finally {
            $archive.Dispose()
          }
      - name: Generate ZIP SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist\FLDailyEditInstaller.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FLDailyEditInstaller.zip" | Set-Content -Path "dist\FLDailyEditInstaller.zip.sha256" -Encoding ascii
      - name: Upload internal build artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ github.run_id }}
          path: |
            dist/FLDailyEditInstaller.zip
            dist/FLDailyEditInstaller.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Windows installer
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fldailyedit-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installer-${{ github.run_id }}
          path: release-payload
      - name: Publish rolling release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$GH_REPO" >/dev/null 2>&1 || gh release create latest --repo "$GH_REPO" --title "Latest FL Daily Edit" --notes "Validated FL Daily Edit release assets."
          python tools/publish_release_assets.py \
            --repo "$GH_REPO" \
            --tag latest \
            release-payload/FLDailyEditInstaller.zip \
            release-payload/FLDailyEditInstaller.zip.sha256
      - name: Remove legacy standalone installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="$(gh release view latest --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for legacy in FLDailyEditInstaller.exe FLDailyEditInstaller.exe.sha256; do
            case $'\n'"$assets"$'\n' in
              *$'\n'"$legacy"$'\n'*)
                gh release delete-asset latest "$legacy" --repo "$GH_REPO" --yes
                ;;
            esac
          done
