name: Build Windows Installer

# Disabled: the Windows app is no longer built or published automatically.
# Restore the push trigger below to re-enable builds on main.
#
# Runs on Ubuntu and cross-compiles only the Windows executable
# (x86_64-pc-windows-gnu with mingw-w64).
#
# The release assets keep the names the app's self-updater (and the older
# builds already installed on user PCs) expect:
#   FLDailyEditInstaller.zip (exactly one entry: FLDailyEditInstaller.exe),
#   FLDailyEditInstaller.zip.sha256, installer-update.json and
#   installer-update.json.sig. The entry holds the Rust app (`fldailyedit.exe`
#   renamed); bump `version` in the workspace Cargo.toml for every release,
#   because the updater only installs a strictly newer version.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the latest release (existing installs self-update to it)"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "crates/**"
  #     - "data/**"
  #     - ".github/workflows/build-installer.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    name: Build, sign and publish Windows app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fldailyedit-latest-release
      cancel-in-progress: false
    steps:
      - name: Require installer signing key
        env:
          SIGNING_KEY_CONFIGURED: ${{ secrets.INSTALLER_SIGNING_KEY != '' }}
        run: |
          if [ "$SIGNING_KEY_CONFIGURED" != "true" ]; then
            echo "::error::INSTALLER_SIGNING_KEY secret is required to sign installer-update.json"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mingw-w64 and Rust Windows target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$WINDOWS_TARGET"
          rustc --version
          cargo --version
      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-installer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-installer-${{ runner.os }}-
      - name: Build Windows executable
        run: cargo build --release --locked -p fl-app --target "$WINDOWS_TARGET"
      - name: Check executable format
        run: |
          exe="target/$WINDOWS_TARGET/release/fldailyedit.exe"
          info="$(file -b "$exe")"
          echo "$info"
          case "$info" in
            PE32+*GUI*x86-64*) ;;
            *) echo "::error::expected a 64-bit Windows GUI executable"; exit 1 ;;
          esac
      - name: Package installer ZIP
        run: |
          mkdir -p dist
          cp "target/$WINDOWS_TARGET/release/fldailyedit.exe" dist/FLDailyEditInstaller.exe
          (cd dist && zip -9 -X FLDailyEditInstaller.zip FLDailyEditInstaller.exe)
          entries="$(zipinfo -1 dist/FLDailyEditInstaller.zip)"
          if [ "$entries" != "FLDailyEditInstaller.exe" ]; then
            echo "::error::Installer ZIP must contain exactly FLDailyEditInstaller.exe"
            exit 1
          fi
          (cd dist && sha256sum FLDailyEditInstaller.zip > FLDailyEditInstaller.zip.sha256)
      - name: Generate installer update manifest
        run: >-
          cargo run --release --locked -p fl-update --bin sign-manifest --
          build
          --asset dist/FLDailyEditInstaller.zip
          --output dist/installer-update.json
      - name: Sign installer update manifest
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: >-
          cargo run --release --locked -p fl-update --bin sign-manifest --
          sign
          --manifest dist/installer-update.json
          --output dist/installer-update.json.sig
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish rolling release assets
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$GH_REPO" >/dev/null 2>&1 || gh release create latest --repo "$GH_REPO" --title "Latest FL Daily Edit" --notes "Validated FL Daily Edit release assets."
          # The manifest goes last so it never points at a missing archive.
          gh release upload latest --repo "$GH_REPO" --clobber \
            dist/FLDailyEditInstaller.zip \
            dist/FLDailyEditInstaller.zip.sha256
          gh release upload latest --repo "$GH_REPO" --clobber dist/installer-update.json.sig
          gh release upload latest --repo "$GH_REPO" --clobber dist/installer-update.json
      - name: Remove legacy standalone installer assets
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="$(gh release view latest --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for legacy in FLDailyEditInstaller.exe FLDailyEditInstaller.exe.sha256; do
            case $'\n'"$assets"$'\n' in
              *$'\n'"$legacy"$'\n'*)
                gh release delete-asset latest "$legacy" --repo "$GH_REPO" --yes
                ;;
            esac
          done
