name: Sync Live Transfers (Fast)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Scrape & Apply Transfers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Compile pesXdecrypter
        run: |
          make -C vendor/pesXdecrypter clean
          make -C vendor/pesXdecrypter
          chmod +x vendor/pesXdecrypter/decrypter21 vendor/pesXdecrypter/encrypter21

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Transfer Sync
        id: run_sync
        run: |
          python run.py validate --edit-file base/EDIT00000000
          python run.py run \
            --window auto \
            --edit-file base/EDIT00000000 \
            --output output/EDIT00000000

      - name: Upload Updated Save File & Visual Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-fl-save-and-reports
          path: |
            output/EDIT00000000
            output/transfer_summary.md
            output/transfer_summary.html
            data/transfer_log.jsonl
          if-no-files-found: ignore
          retention-days: 14
