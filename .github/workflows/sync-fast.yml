name: Sync Live Transfers (Fast)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Scrape & Apply Transfers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Compile pesXdecrypter
        run: |
          make -C vendor/pesXdecrypter clean
          make -C vendor/pesXdecrypter
          chmod +x vendor/pesXdecrypter/decrypter21 vendor/pesXdecrypter/encrypter21

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Base and Apply Updates
        id: run_sync
        run: |
          python run.py validate --edit-file base/EDIT00000000
          python run.py players validate
          BASE_REVISION="$(python -c 'import json; print(json.load(open("data/base_manifest.json", encoding="utf-8"))["revision"])')"
          mkdir -p output
          cp base/EDIT00000000 output/EDIT00000000
          python run.py run \
            --window auto \
            --edit-file output/EDIT00000000 \
            --in-place
          python run.py players apply \
            --base-revision "$BASE_REVISION" \
            --edit-file output/EDIT00000000 \
            --in-place

      - name: Validate final save
        run: python run.py validate --edit-file output/EDIT00000000

      - name: Package public Fast save
        run: |
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python tools/build_release_asset.py package \
            --save output/EDIT00000000 \
            --output-dir release-payload \
            --target-id fl26-u2.2-national-squads \
            --target-name "Football Life 2026 Update 2.2 + National Squads" \
            --channel fast \
            --generated-at "$GENERATED_AT"

      - name: Upload release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-fast
          path: release-payload/
          retention-days: 1

      - name: Upload Updated Save File & Visual Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updated-fl-save-and-reports
          path: |
            output/EDIT00000000
            output/transfer_summary.md
            output/transfer_summary.html
            data/transfer_log.jsonl
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish Fast save
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fldailyedit-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-fast
          path: release-payload
      - name: Merge release catalog
        run: python tools/build_release_asset.py merge --existing-url "https://github.com/gvoze32/fldailyedit/releases/download/latest/catalog.json" --record release-payload/record.json --output release-payload/catalog.json
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest FL Daily Edit" --notes "Validated Fast and Deep option files for FL Daily Edit."
          gh release upload latest release-payload/fldailyedit-fl2026-fast.zip release-payload/catalog.json --clobber
