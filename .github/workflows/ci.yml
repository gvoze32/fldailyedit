name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Compile pesXdecrypter binaries on Ubuntu
        run: |
          make -C vendor/pesXdecrypter clean
          make -C vendor/pesXdecrypter
          chmod +x vendor/pesXdecrypter/decrypter21 vendor/pesXdecrypter/encrypter21


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest


      - name: Run Test Suite
        run: |
          pytest -v

