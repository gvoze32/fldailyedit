name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Compile pesXdecrypter binaries
        run: |
          make -C vendor/pesXdecrypter clean
          make -C vendor/pesXdecrypter
          chmod +x vendor/pesXdecrypter/decrypter21 vendor/pesXdecrypter/encrypter21

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Validate player specifications
        run: |
          python run.py players validate

      - name: Run Test Suite
        run: |
          pytest -v

  player-spec-pr:
    name: Validate player specification pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Enforce player specification change boundary
        env:
          CHANGES_FILE: ${{ runner.temp }}/player-spec-pr-changes.tsv
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_GUARD: ${{ runner.temp }}/check-player-spec-pr.py
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_SHA"
          git diff --name-status --diff-filter=ACDMRTUXB "$GITHUB_BASE_SHA...HEAD" -- > "$CHANGES_FILE"
          git show "${GITHUB_BASE_SHA}:tools/check_player_spec_pr.py" > "$TRUSTED_GUARD"
          python "$TRUSTED_GUARD" --changes-file "$CHANGES_FILE"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate player specifications
        run: |
          python run.py players validate
