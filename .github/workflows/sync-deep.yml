name: Sync Live Transfers (Deep)

# Manual only: FL Daily Edit runs locally and prebuilt saves are no longer
# published. Restore the schedule below to re-enable daily runs.
#
# The app has ONE update mode with full coverage, so this "deep" workflow and
# its fast twin run exactly the same command. Both files are kept only so
# existing forks keep their workflow names. The updated save is uploaded as a
# workflow artifact; nothing is published to a release.
#
# NEEDS THE GAME FILES: every save reads its player and club lists from the
# game's own Player.bin / Team.bin (data_extra.cpk), which this repository does
# not contain. Before re-enabling a schedule, make `GAME_ROOT` (a repository
# variable) point at a folder on the runner that holds the game's CPK files
# (for example a self-hosted runner with the game installed). Without it the
# "Require the game files" step fails the run with an explanation.
on:
  # schedule:
  #   # Run daily at 00:00 UTC
  #   - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Folder with the game's CPK files (see the note at the top).
  GAME_ROOT: ${{ vars.GAME_ROOT }}
  # The app keeps its state (transfer log, reports, caches, backups) under
  # $XDG_DATA_HOME/FLDailyEdit on Linux; point it into the workspace so the
  # cache and artifact steps can reach it.
  XDG_DATA_HOME: ${{ github.workspace }}/state

jobs:
  sync:
    name: Scrape & Apply Transfers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install window-system headers for the app crate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-sync-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sync-${{ runner.os }}-

      - name: Restore FotMob payload cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            state/FLDailyEdit/storage/fotmob_team_cache/
            state/FLDailyEdit/storage/fotmob_tactics_cache.json
            state/FLDailyEdit/storage/fotmob_teams.json
            state/FLDailyEdit/club_identity_cache.json
          key: fotmob-deep-payload-${{ github.run_id }}
          restore-keys: |
            fotmob-deep-payload-

      - name: Require the game files
        run: |
          if [ -z "${GAME_ROOT:-}" ] || [ ! -d "$GAME_ROOT" ]; then
            echo "::error::GAME_ROOT is not set to an existing folder. Every save reads its player and club lists from the game (data_extra.cpk), which is not part of this repository. Set the GAME_ROOT repository variable to a folder with the game's CPK files."
            exit 1
          fi

      - name: Validate Base and Apply Transfers
        run: |
          cargo run --release --locked -p fl-app -- validate --edit-file base/EDIT00000000
          mkdir -p output
          cp base/EDIT00000000 output/EDIT00000000
          cargo run --release --locked -p fl-app -- run \
            --window auto \
            --game-root "$GAME_ROOT" \
            --edit-file output/EDIT00000000

      - name: Validate final save
        run: cargo run --release --locked -p fl-app -- validate --edit-file output/EDIT00000000

      - name: Upload Updated Save File & Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-fl-save-and-reports-${{ github.run_id }}-deep
          path: |
            output/EDIT00000000
            state/FLDailyEdit/reports/
            state/FLDailyEdit/transfer_log.jsonl
          if-no-files-found: error
          retention-days: 14
